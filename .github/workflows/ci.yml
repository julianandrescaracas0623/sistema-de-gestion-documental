name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typedRoutes (next.config.ts) makes `Route` a strict literal union, but
      # that type only exists once .next/types is generated — without it,
      # `as Route` assertions look "unnecessary" to typecheck/lint (false
      # positive) even though they're required in a real build.
      - run: pnpm exec next typegen

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
